<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Approve</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Arial;padding:20px;background:#f5f5f5} .card{background:white;padding:15px;border-radius:10px;margin-bottom:10px} input{padding:10px;border:1px solid #ddd;border-radius:8px;width:100%;margin:5px 0} button{padding:10px 15px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;margin:5px 0} .green{background:#10b981;color:white} .box{background:white;padding:20px;border-radius:15px;max-width:500px;margin:0 auto}</style>
</head><body>
<div class="box">
<h2>Admin Panel</h2>
<input type="password" id="pass" placeholder="Password: admin123">
<button onclick="load()" class="green">Load Pending Payments</button>

<h3 style="margin-top:20px">Manual Approve (for mom's phone)</h3>
<input type="text" id="manualEmail" placeholder="Enter email to approve (mom's email)">
<input type="text" id="manualUtr" placeholder="UTR: 626019819396">
<button onclick="manualApprove()" style="background:#667eea;color:white;width:100%">Approve This Email Instantly</button>

<div id="list" style="margin-top:20px"></div>
<div id="msg" style="margin-top:15px;font-weight:bold"></div>
</div>
<script>
const supabase = window.supabase.createClient('https://ztocwdfliodtjvmddqvb.supabase.co','sb_publishable_YhnQ6f1iSiaXt92GamwJPA_YWBIal-t');
async function load(){
 if(document.getElementById('pass').value!=='admin123'){alert('Wrong password');return;}
 document.getElementById('msg').textContent='Loading...';
 const {data,error}=await supabase.from('payments').select('*').order('created_at',{ascending:false});
 if(error){document.getElementById('msg').textContent='Error: '+error.message+' | Run SQL: ALTER TABLE payments DISABLE ROW LEVEL SECURITY;';return;}
 const list=document.getElementById('list'); list.innerHTML='';
 data.forEach(p=>{
   const div=document.createElement('div'); div.className='card';
   div.innerHTML=`<b>${p.email}</b><br>UTR: ${p.utr}<br>Status: ${p.status} ${p.status!='approved'?`<br><button class="green" onclick="approve('${p.id}')">Approve</button>`:''}`;
   list.appendChild(div);
 });
 document.getElementById('msg').textContent='Loaded '+data.length+' payments';
}
async function approve(id){
 const {error}=await supabase.from('payments').update({status:'approved'}).eq('id',id);
 if(error){alert(error.message);return;} alert('Approved!'); load();
}
async function manualApprove(){
 const email=document.getElementById('manualEmail').value.trim().toLowerCase();
 const utr=document.getElementById('manualUtr').value.trim()||'626019819396';
 if(!email){alert('Enter email');return;}
 if(document.getElementById('pass').value!=='admin123'){alert('Enter admin password first');return;}
 document.getElementById('msg').textContent='Approving...';
 const {error}=await supabase.from('payments').insert({email:email,utr:utr,status:'approved'});
 if(error){
   // If already exists, update it
   const {error: e2}=await supabase.from('payments').update({status:'approved',utr:utr}).eq('email',email);
   if(e2){document.getElementById('msg').textContent='Error: '+e2.message;return;}
 }
 document.getElementById('msg').style.color='green';
 document.getElementById('msg').textContent='✅ Approved '+email+' ! Now that phone can open index.html';
}
</script>
</body></html>
