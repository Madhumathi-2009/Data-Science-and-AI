<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Payment Panel</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#111827;
}

.box{
    max-width:650px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

h2{
    margin-top:0;
    color:#111827;
}

h3{
    margin-bottom:10px;
}

input{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1.5px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#667eea;
}

button{
    width:100%;
    padding:13px;
    margin:6px 0;
    border:0;
    border-radius:10px;
    font-weight:bold;
    font-size:14px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    transform:translateY(-1px);
    opacity:.92;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.blue{
    background:#667eea;
    color:white;
}

.green{
    background:#10b981;
    color:white;
}

.red{
    background:#ef4444;
    color:white;
}

.gray{
    background:#6b7280;
    color:white;
}

.manual{
    margin-top:20px;
    padding:18px;
    background:#f0fdf4;
    border:2px solid #10b981;
    border-radius:14px;
}

.message{
    margin-top:18px;
    padding:13px;
    border-radius:10px;
    background:#eef2ff;
    white-space:pre-wrap;
    word-break:break-word;
    font-size:14px;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.card{
    margin-top:12px;
    padding:16px;
    border:1px solid #e5e7eb;
    border-radius:13px;
    background:#fff;
}

.card.email{
    font-weight:bold;
    font-size:15px;
}

.status{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.pending{
    background:#fef3c7;
    color:#92400e;
}

.approved{
    background:#dcfce7;
    color:#166534;
}

.rejected{
    background:#fee2e2;
    color:#991b1b;
}

.small{
    color:#6b7280;
    font-size:12px;
    margin-top:8px;
}

hr{
    border:0;
    border-top:1px solid #eee;
    margin:22px 0;
}
</style>

</head>

<body>

<div class="box">

```
<h2>🔐 Admin Payment Panel</h2>

<input
    type="password"
    id="pass"
    value="admin123"
    placeholder="Admin password"
>

<button class="blue" onclick="loadPayments()">
    📋 Load All Payments
</button>

<div class="manual">

    <h3>✅ Manual Approval</h3>

    <p style="font-size:13px;color:#555;">
        Use this if a payment exists but you want to approve the user manually.
    </p>

    <input
        type="email"
        id="mEmail"
        placeholder="User's exact email"
    >

    <input
        type="text"
        id="mUtr"
        placeholder="UTR number"
    >

    <button class="green" onclick="manualApprove()">
        ✅ Approve User
    </button>

</div>

<div id="msg" class="message">
    Enter the admin password and click "Load All Payments".
</div>

<div id="list"></div>

<hr>

<button class="red" onclick="testConnection()">
    🔧 Test Supabase Connection
</button>
```

</div>

<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
    "https://ztocwdfliodtjvmddqvb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_YhnQ6f1iSiaXt92GamwJPA_YWBIal-t";


/* =====================================================
   HELPERS
===================================================== */

function headers(extra = {}) {

    return {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        ...extra
    };

}


function message(text, type = "") {

    const box = document.getElementById("msg");

    box.textContent = text;

    box.className = "message";

    if(type){
        box.classList.add(type);
    }

}


function checkPassword(){

    const password =
        document.getElementById("pass").value;

    if(password !== "admin123"){

        alert("Wrong admin password.");

        return false;
    }

    return true;
}


/* =====================================================
   TEST CONNECTION
===================================================== */

async function testConnection(){

    message("Testing Supabase connection...");

    try{

        const response = await fetch(
            SUPABASE_URL +
            "/rest/v1/payments?select=*",
            {
                method:"GET",
                headers:headers()
            }
        );

        const text = await response.text();

        if(response.ok){

            message(
                "✅ Supabase connection successful!\n\n" +
                "HTTP Status: " +
                response.status +
                "\n\nResponse:\n" +
                text.substring(0,1000),
                "success"
            );

        }else{

            message(
                "❌ Supabase returned an error.\n\n" +
                "HTTP Status: " +
                response.status +
                "\n\n" +
                text,
                "error"
            );

        }

    }catch(error){

        message(
            "❌ Browser connection error:\n\n" +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   LOAD PAYMENTS
===================================================== */

async function loadPayments(){

    if(!checkPassword()) return;

    message("⏳ Loading payments...");

    const list =
        document.getElementById("list");

    list.innerHTML = "";

    try{

        const url =
            SUPABASE_URL +
            "/rest/v1/payments" +
            "?select=*" +
            "&order=created_at.desc";

        const response = await fetch(
            url,
            {
                method:"GET",
                headers:headers()
            }
        );

        const text = await response.text();

        if(!response.ok){

            message(
                "❌ Could not load payments.\n\n" +
                "HTTP Status: " +
                response.status +
                "\n\n" +
                text,
                "error"
            );

            return;
        }

        let data;

        try{

            data = JSON.parse(text);

        }catch{

            message(
                "❌ Supabase returned invalid JSON:\n\n" +
                text,
                "error"
            );

            return;
        }


        message(
            "✅ Loaded " +
            data.length +
            " payment(s).",
            "success"
        );


        if(data.length === 0){

            list.innerHTML =
                "<p style='text-align:center;color:#666;margin-top:20px'>" +
                "No payments found." +
                "</p>";

            return;
        }


        data.forEach(payment => {

            createPaymentCard(payment);

        });


    }catch(error){

        message(
            "❌ Error loading payments:\n\n" +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   CREATE PAYMENT CARD
===================================================== */

function createPaymentCard(payment){

    const card =
        document.createElement("div");

    card.className = "card";


    const email =
        payment.email || "No email";

    const utr =
        payment.utr || "No UTR";

    const status =
        payment.status || "pending";

    const created =
        payment.created_at || "";


    let statusClass = "pending";

    if(status === "approved"){
        statusClass = "approved";
    }

    if(status === "rejected"){
        statusClass = "rejected";
    }


    const emailDiv =
        document.createElement("div");

    emailDiv.className = "email";

    emailDiv.textContent =
        "📧 " + email;


    const utrDiv =
        document.createElement("div");

    utrDiv.style.marginTop = "7px";

    utrDiv.textContent =
        "🔢 UTR: " + utr;


    const statusDiv =
        document.createElement("div");

    statusDiv.style.marginTop = "8px";

    const badge =
        document.createElement("span");

    badge.className =
        "status " + statusClass;

    badge.textContent =
        status.toUpperCase();

    statusDiv.appendChild(badge);


    const dateDiv =
        document.createElement("div");

    dateDiv.className = "small";

    dateDiv.textContent =
        created;


    card.appendChild(emailDiv);

    card.appendChild(utrDiv);

    card.appendChild(statusDiv);

    card.appendChild(dateDiv);


    if(status !== "approved"){

        const approveButton =
            document.createElement("button");

        approveButton.className = "green";

        approveButton.textContent =
            "✅ Approve This User";

        approveButton.style.marginTop = "12px";

        approveButton.onclick = function(){

            approveEmail(email);

        };

        card.appendChild(approveButton);

    }else{

        const approved =
            document.createElement("div");

        approved.style.marginTop = "12px";

        approved.style.color = "#059669";

        approved.style.fontWeight = "bold";

        approved.textContent =
            "✓ Already Approved";

        card.appendChild(approved);

    }


    document.getElementById("list")
        .appendChild(card);

}


/* =====================================================
   APPROVE EXISTING EMAIL
===================================================== */

async function approveEmail(email){

    if(!checkPassword()) return;

    if(!confirm(
        "Approve this user?\n\n" + email
    )){
        return;
    }


    message(
        "⏳ Approving " + email + "..."
    );


    try{

        const url =
            SUPABASE_URL +
            "/rest/v1/payments" +
            "?email=eq." +
            encodeURIComponent(email);


        const response =
            await fetch(
                url,
                {
                    method:"PATCH",
                    headers:headers({
                        "Prefer":"return=representation"
                    }),
                    body:JSON.stringify({
                        status:"approved"
                    })
                }
            );


        const text =
            await response.text();


        if(!response.ok){

            message(
                "❌ Approval failed.\n\n" +
                "HTTP Status: " +
                response.status +
                "\n\n" +
                text,
                "error"
            );

            return;
        }


        message(
            "✅ " +
            email +
            " has been approved!",
            "success"
        );


        await loadPayments();

    }catch(error){

        message(
            "❌ Approval error:\n\n" +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   MANUAL APPROVAL
===================================================== */

async function manualApprove(){

    if(!checkPassword()) return;


    const email =
        document.getElementById("mEmail")
        .value
        .trim()
        .toLowerCase();


    const utr =
        document.getElementById("mUtr")
        .value
        .trim();


    if(!email){

        alert("Enter the user's email.");

        return;
    }


    if(!utr){

        alert("Enter the UTR number.");

        return;
    }


    if(!confirm(
        "Approve this user?\n\n" +
        "Email: " + email +
        "\nUTR: " + utr
    )){
        return;
    }


    message(
        "⏳ Checking existing payment..."
    );


    try{

        /* ---------------------------------------------
           STEP 1: CHECK WHETHER EMAIL EXISTS
        --------------------------------------------- */

        const findURL =
            SUPABASE_URL +
            "/rest/v1/payments" +
            "?select=*" +
            "&email=eq." +
            encodeURIComponent(email);


        const findResponse =
            await fetch(
                findURL,
                {
                    method:"GET",
                    headers:headers()
                }
            );


        const findText =
            await findResponse.text();


        if(!findResponse.ok){

            message(
                "❌ Could not check payment.\n\n" +
                findText,
                "error"
            );

            return;
        }


        const existing =
            JSON.parse(findText);


        /* ---------------------------------------------
           STEP 2: UPDATE EXISTING PAYMENT
        --------------------------------------------- */

        if(existing.length > 0){

            message(
                "⏳ Existing payment found. Approving..."
            );


            const updateURL =
                SUPABASE_URL +
                "/rest/v1/payments" +
                "?email=eq." +
                encodeURIComponent(email);


            const updateResponse =
                await fetch(
                    updateURL,
                    {
                        method:"PATCH",
                        headers:headers({
                            "Prefer":"return=representation"
                        }),
                        body:JSON.stringify({
                            status:"approved",
                            utr:utr
                        })
                    }
                );


            const updateText =
                await updateResponse.text();


            if(!updateResponse.ok){

                message(
                    "❌ Update failed.\n\n" +
                    updateText,
                    "error"
                );

                return;
            }


            message(
                "✅ USER APPROVED!\n\n" +
                "Email: " + email +
                "\nUTR: " + utr +
                "\n\n" +
                "The user can now log in again.",
                "success"
            );


            await loadPayments();

            return;
        }


        /* ---------------------------------------------
           STEP 3: INSERT NEW APPROVED PAYMENT
        --------------------------------------------- */

        message(
            "⏳ User not found. Creating approved payment..."
        );


        const insertResponse =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/payments",
                {
                    method:"POST",
                    headers:headers({
                        "Prefer":"return=representation"
                    }),
                    body:JSON.stringify({
                        email:email,
                        utr:utr,
                        status:"approved"
                    })
                }
            );


        const insertText =
            await insertResponse.text();


        if(!insertResponse.ok){

            message(
                "❌ Could not create payment.\n\n" +
                "HTTP Status: " +
                insertResponse.status +
                "\n\n" +
                insertText,
                "error"
            );

            return;
        }


        message(
            "✅ USER APPROVED!\n\n" +
            "Email: " + email +
            "\nUTR: " + utr +
            "\n\n" +
            "The user can now log in again.",
            "success"
        );


        await loadPayments();


    }catch(error){

        message(
            "❌ Manual approval error:\n\n" +
            error.message,
            "error"
        );

    }

}

</script>

</body>
</html>
