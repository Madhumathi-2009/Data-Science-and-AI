<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Approve Payments</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f5f5f5;padding:15px} 
.box{max-width:600px;margin:0 auto;background:white;padding:20px;border-radius:15px}
input{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:10px;margin:8px 0;box-sizing:border-box}
button{width:100%;padding:12px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin:5px 0}
.green{background:#10b981;color:white} .blue{background:#667eea;color:white}
.card{border:1px solid #eee;padding:12px;border-radius:10px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}
.pending{color:orange;font-weight:bold} .approved{color:green;font-weight:bold}
#msg{margin-top:10px;padding:10px;border-radius:8px;font-size:13px}
</style>
</head><body>
<div class="box">
<h2>Admin Panel 💰</h2>
<input type="password" id="pass" value="admin123">
<button class="blue" onclick="load()">Load Pending Payments</button>

<div style="background:#f9fafb;padding:15px;border-radius:10px;margin-top:15px">
<h4>Manual Approve (Use for your mom now)</h4>
<input type="text" id="mEmail" placeholder="Mom's email (exact from login)">
<input type="text" id="mUtr" placeholder="UTR: 626019819396" value="626019819396">
<button class="green" onclick="manualApprove()">Approve This Email Now</button>
</div>

<div id="msg"></div>
<div id="list"></div>
</div>
<script>
const SUPABASE_URL = 'https://ztocwdfliodtjvmddqvb.supabase.co';
const SUPABASE_KEY = 'sb_publishable_YhnQ6f1iSiaXt92GamwJPA_YWBIal-t';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function load(){
  const pass = document.getElementById('pass').value;
  if(pass !== 'admin123'){ alert('Password is admin123'); return; }
  document.getElementById('msg').innerHTML = '⏳ Loading...';
  document.getElementById('msg').style.background='#eef2ff';
  try{
    const {data, error} = await supabase.from('payments').select('*').order('created_at',{ascending:false});
    if(error){ 
      document.getElementById('msg').innerHTML = '❌ Error: '+error.message+'<br><br>Run the SQL I gave in Supabase SQL Editor!'; 
      document.getElementById('msg').style.background='#fee2e2'; 
      return; 
    }
    const list = document.getElementById('list');
    list.innerHTML = '';
    if(!data || data.length===0){ 
      document.getElementById('msg').innerHTML='No payments yet. When someone pays, their Email + UTR will show here.'; 
      return; 
    }
    data.forEach(p=>{
      const div = document.createElement('div');
      div.className='card';
      div.innerHTML = `<div><b>${p.email}</b><br>UTR: ${p.utr}<br>Status: <span class="${p.status}">${p.status}</span><br><small>${new Date(p.created_at).toLocaleString()}</small></div><div>${p.status!=='approved'?`<button class="green" style="width:auto;padding:8px 15px" onclick="approveId('${p.id}')">Approve</button>`:'✓ Done'}</div>`;
      list.appendChild(div);
    });
    document.getElementById('msg').innerHTML = `✅ Loaded ${data.length} payments. Pending will show email+UTR above.`;
    document.getElementById('msg').style.background='#dcfce7';
  }catch(e){
    document.getElementById('msg').innerHTML='JS Error: '+e.message;
  }
}

async function approveId(id){
  const {error} = await supabase.from('payments').update({status:'approved'}).eq('id',id);
  if(error){alert(error.message);return;}
  alert('Approved!'); load();
}

async function manualApprove(){
  const email = document.getElementById('mEmail').value.trim().toLowerCase();
  const utr = document.getElementById('mUtr').value.trim();
  if(!email){alert('Enter mom email');return;}
  document.getElementById('msg').innerHTML='Approving...';
  // Try insert, if exists update
  let {error} = await supabase.from('payments').insert({email:email, utr:utr, status:'approved'});
  if(error){
    const res = await supabase.from('payments').update({status:'approved', utr:utr}).eq('email', email);
    if(res.error){ document.getElementById('msg').innerHTML='Error: '+res.error.message; return; }
  }
  document.getElementById('msg').innerHTML=`<span style="color:green">✅ Approved ${email} !<br>Now on mom's phone, open index.html - it will work!</span>`;
  load();
}
</script>
</body></html>
