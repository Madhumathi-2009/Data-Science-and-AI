<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Admin - Payment Approval</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f4f6fb;
    color:#111827;
}

.container{
    width:100%;
    max-width:700px;
    margin:20px auto;
}

.panel{
    background:white;
    padding:24px;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,.08);
}

h2{
    margin-top:0;
}

input{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
}

button{
    width:100%;
    border:0;
    padding:13px;
    margin:6px 0;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.blue{
    background:#667eea;
    color:white;
}

.green{
    background:#10b981;
    color:white;
}

.red{
    background:#ef4444;
    color:white;
}

.manual{
    margin-top:20px;
    padding:18px;
    border-radius:14px;
    border:2px solid #10b981;
    background:#f0fdf4;
}

.message{
    margin-top:18px;
    padding:14px;
    border-radius:10px;
    background:#eef2ff;
    white-space:pre-wrap;
    word-break:break-word;
    font-size:14px;
}

.success{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.card{
    margin-top:12px;
    padding:16px;
    border:1px solid #e5e7eb;
    border-radius:13px;
    background:white;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.pending{
    background:#fef3c7;
    color:#92400e;
}

.approved{
    background:#dcfce7;
    color:#166534;
}

.small{
    margin-top:7px;
    font-size:12px;
    color:#6b7280;
}

.approve{
    margin-top:12px;
}

</style>

</head>

<body>

<div class="container">

<div class="panel">

<h2>🔐 Admin Payment Panel</h2>

<input
type="password"
id="password"
value="admin123"
placeholder="Admin password"

>

<button
class="blue"
id="loadBtn"

>

📋 Load All Payments </button>

<div class="manual">

<h3>✅ Manual Approval</h3>

<p style="font-size:13px;color:#555;">
Use this when you want to approve a student directly.
</p>

<input
type="email"
id="manualEmail"
placeholder="Student email"

>

<input
type="text"
id="manualUtr"
placeholder="UTR / Transaction ID"

>

<button
class="green"
id="manualBtn"

>

Approve Student </button>

</div>

<div
    id="message"
    class="message"
>
Ready.
</div>

<div id="payments"></div>

<hr style="border:0;border-top:1px solid #eee;margin:25px 0;">

<button
class="red"
id="testBtn"

>

🔧 Test Supabase Connection </button>

</div>

</div>

<script>

const SUPABASE_URL =
    "https://ztocwdfliodtjvmddqvb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_YhnQ6f1iSiaXt92GamwJPA_YWBIal-t";


const ADMIN_PASSWORD =
    "admin123";


function getHeaders(extra={}){

    return {
        "apikey":SUPABASE_KEY,
        "Authorization":
            "Bearer " + SUPABASE_KEY,
        "Content-Type":
            "application/json",
        ...extra
    };

}


function setMessage(text,type=""){

    const box =
        document.getElementById("message");

    box.textContent = text;

    box.className = "message";

    if(type){
        box.classList.add(type);
    }

}


function checkPassword(){

    const password =
        document.getElementById("password")
        .value;

    if(password !== ADMIN_PASSWORD){

        alert("Incorrect admin password.");

        return false;
    }

    return true;
}


/* ==========================================
   TEST
========================================== */

document.getElementById("testBtn")
.addEventListener("click",async()=>{

    setMessage(
        "Testing Supabase..."
    );

    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/payments?select=id&limit=1",
                {
                    method:"GET",
                    headers:getHeaders()
                }
            );


        const text =
            await response.text();


        if(response.ok){

            setMessage(
                "✅ Supabase connection works!\n\n" +
                "HTTP " +
                response.status +
                "\n\n" +
                text,
                "success"
            );

        }else{

            setMessage(
                "❌ Supabase connection failed.\n\n" +
                "HTTP " +
                response.status +
                "\n\n" +
                text,
                "error"
            );

        }

    }catch(error){

        setMessage(
            "❌ Browser/network error:\n\n" +
            error.message,
            "error"
        );

    }

});


/* ==========================================
   LOAD
========================================== */

document.getElementById("loadBtn")
.addEventListener("click",loadPayments);


async function loadPayments(){

    if(!checkPassword()) return;


    const list =
        document.getElementById("payments");

    list.innerHTML = "";


    setMessage(
        "Loading payments..."
    );


    try{

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/payments" +
                "?select=*" +
                "&order=created_at.desc",
                {
                    method:"GET",
                    headers:getHeaders()
                }
            );


        const text =
            await response.text();


        if(!response.ok){

            setMessage(
                "❌ Could not load payments.\n\n" +
                "HTTP " +
                response.status +
                "\n\n" +
                text,
                "error"
            );

            return;
        }


        const rows =
            JSON.parse(text);


        setMessage(
            "✅ Loaded " +
            rows.length +
            " payment(s).",
            "success"
        );


        if(rows.length === 0){

            list.innerHTML =
                "<p style='text-align:center;color:#777'>" +
                "No payments yet." +
                "</p>";

            return;
        }


        rows.forEach(row=>{

            renderPayment(row);

        });


    }catch(error){

        setMessage(
            "❌ Error:\n\n" +
            error.message,
            "error"
        );

    }

}


/* ==========================================
   RENDER PAYMENT
========================================== */

function renderPayment(row){

    const card =
        document.createElement("div");

    card.className = "card";


    const email =
        row.email || "Unknown";

    const utr =
        row.utr || "No UTR";

    const status =
        row.status || "pending";

    const date =
        row.created_at || "";


    const emailEl =
        document.createElement("div");

    emailEl.innerHTML =
        "<b>📧 Email</b><br>";

    const emailText =
        document.createElement("span");

    emailText.textContent =
        email;

    emailEl.appendChild(emailText);


    const utrEl =
        document.createElement("div");

    utrEl.style.marginTop = "9px";

    utrEl.innerHTML =
        "<b>🔢 UTR</b><br>";

    const utrText =
        document.createElement("span");

    utrText.textContent =
        utr;

    utrEl.appendChild(utrText);


    const statusEl =
        document.createElement("div");

    statusEl.style.marginTop = "9px";

    const badge =
        document.createElement("span");

    badge.className =
        "badge " +
        (status === "approved"
            ? "approved"
            : "pending");

    badge.textContent =
        status.toUpperCase();

    statusEl.appendChild(badge);


    const dateEl =
        document.createElement("div");

    dateEl.className = "small";

    dateEl.textContent =
        date;


    card.appendChild(emailEl);
    card.appendChild(utrEl);
    card.appendChild(statusEl);
    card.appendChild(dateEl);


    if(status !== "approved"){

        const button =
            document.createElement("button");

        button.className =
            "green approve";

        button.textContent =
            "✅ Approve This Student";

        button.onclick =
            ()=>approveEmail(email);

        card.appendChild(button);

    }else{

        const approved =
            document.createElement("div");

        approved.style.marginTop =
            "12px";

        approved.style.color =
            "#059669";

        approved.style.fontWeight =
            "bold";

        approved.textContent =
            "✓ Approved";

        card.appendChild(approved);

    }


    document.getElementById("payments")
        .appendChild(card);

}


/* ==========================================
   APPROVE EMAIL
========================================== */

async function approveEmail(email){

    if(!checkPassword()) return;


    if(!confirm(
        "Approve:\n\n" + email + "?"
    )){
        return;
    }


    setMessage(
        "Approving " + email + "..."
    );


    try{

        const url =
            SUPABASE_URL +
            "/rest/v1/payments" +
            "?email=eq." +
            encodeURIComponent(email);


        const response =
            await fetch(
                url,
                {
                    method:"PATCH",

                    headers:getHeaders({
                        "Prefer":
                            "return=representation"
                    }),

                    body:JSON.stringify({
                        status:"approved"
                    })
                }
            );


        const text =
            await response.text();


        if(!response.ok){

            setMessage(
                "❌ Approval failed.\n\n" +
                "HTTP " +
                response.status +
                "\n\n" +
                text,
                "error"
            );

            return;
        }


        setMessage(
            "✅ " +
            email +
            " is now APPROVED.",
            "success"
        );


        await loadPayments();


    }catch(error){

        setMessage(
            "❌ Approval error:\n\n" +
            error.message,
            "error"
        );

    }

}


/* ==========================================
   MANUAL APPROVE
========================================== */

document.getElementById("manualBtn")
.addEventListener(
    "click",
    manualApprove
);


async function manualApprove(){

    if(!checkPassword()) return;


    const email =
        document.getElementById("manualEmail")
        .value
        .trim()
        .toLowerCase();


    const utr =
        document.getElementById("manualUtr")
        .value
        .trim();


    if(!email){

        alert("Enter student email.");

        return;
    }


    if(!utr){

        alert("Enter UTR.");

        return;
    }


    setMessage(
        "Checking " + email + "..."
    );


    try{

        /* First see whether a row exists */

        const findResponse =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/payments" +
                "?select=id" +
                "&email=eq." +
                encodeURIComponent(email) +
                "&limit=1",
                {
                    method:"GET",
                    headers:getHeaders()
                }
            );


        const findText =
            await findResponse.text();


        if(!findResponse.ok){

            setMessage(
                "❌ Could not check email.\n\n" +
                "HTTP " +
                findResponse.status +
                "\n\n" +
                findText,
                "error"
            );

            return;
        }


        const rows =
            JSON.parse(findText);


        /* Existing row */

        if(rows.length > 0){

            const updateResponse =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/payments" +
                    "?email=eq." +
                    encodeURIComponent(email),
                    {
                        method:"PATCH",

                        headers:getHeaders({
                            "Prefer":
                                "return=representation"
                        }),

                        body:JSON.stringify({
                            status:"approved",
                            utr:utr
                        })
                    }
                );


            const updateText =
                await updateResponse.text();


            if(!updateResponse.ok){

                setMessage(
                    "❌ Could not approve.\n\n" +
                    "HTTP " +
                    updateResponse.status +
                    "\n\n" +
                    updateText,
                    "error"
                );

                return;
            }

        }else{

            /* No row — create approved one */

            const insertResponse =
                await fetch(
                    SUPABASE_URL +
                    "/rest/v1/payments",
                    {
                        method:"POST",

                        headers:getHeaders({
                            "Prefer":
                                "return=representation"
                        }),

                        body:JSON.stringify({
                            email:email,
                            utr:utr,
                            status:"approved"
                        })
                    }
                );


            const insertText =
                await insertResponse.text();


            if(!insertResponse.ok){

                setMessage(
                    "❌ Could not create approval.\n\n" +
                    "HTTP " +
                    insertResponse.status +
                    "\n\n" +
                    insertText,
                    "error"
                );

                return;
            }

        }


        setMessage(
            "✅ STUDENT APPROVED!\n\n" +
            "Email: " +
            email +
            "\nUTR: " +
            utr,
            "success"
        );


        document.getElementById(
            "manualEmail"
        ).value = "";


        document.getElementById(
            "manualUtr"
        ).value = "";


        await loadPayments();


    }catch(error){

        setMessage(
            "❌ Manual approval error:\n\n" +
            error.message,
            "error"
        );

    }

}

</script>

</body>
</html>
