<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Approve Payments</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Arial;padding:20px;background:#f5f5f5} .card{background:white;padding:15px;border-radius:10px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center} button{padding:8px 15px;border:none;border-radius:6px;cursor:pointer;font-weight:bold} .approve{background:#10b981;color:white} .pending{color:orange;font-weight:bold}</style>
</head><body>
<h2>Admin - Payment Approvals</h2>
<input type="password" id="pass" placeholder="Enter admin password: admin123">
<button onclick="load()">Load Payments</button>
<div id="list" style="margin-top:20px"></div>
<script>
const supabase = window.supabase.createClient('https://ztocwdfliodtjvmddqvb.supabase.co','sb_publishable_YhnQ6f1iSiaXt92GamwJPA_YWBIal-t');
async function load(){
 if(document.getElementById('pass').value!=='admin123'){alert('Wrong password');return;}
 const {data}=await supabase.from('payments').select('*').order('created_at',{ascending:false});
 const list=document.getElementById('list'); list.innerHTML='';
 data.forEach(p=>{
   const div=document.createElement('div'); div.className='card';
   div.innerHTML=`<div><b>${p.email}</b><br>UTR: ${p.utr}<br>Status: <span class="${p.status}">${p.status}</span></div><div>${p.status!=='approved'?`<button class="approve" onclick="approve('${p.id}')">Approve</button>`: '✓ Approved'}</div>`;
   list.appendChild(div);
 });
}
async function approve(id){
 await supabase.from('payments').update({status:'approved'}).eq('id',id);
 alert('Approved!'); load();
}
</script>
</body></html>
