<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment - Data Science Notes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{min-height:100vh;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);display:flex;justify-content:center;align-items:center;padding:20px}
.card{background:white;width:100%;max-width:420px;padding:30px;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,0.2);text-align:center}
h2{font-size:22px;margin-bottom:5px}
.sub{color:#666;font-size:13px;margin-bottom:20px}
.qr-box{background:#f9fafb;border:2px dashed #e5e7eb;border-radius:15px;padding:15px;margin:15px 0}
.qr-box img{width:100%;max-width:280px;border-radius:10px}
.email-badge{background:#eef2ff;color:#667eea;padding:6px 12px;border-radius:20px;font-size:12px;display:inline-block;margin-bottom:15px}
input{width:100%;padding:14px;border:2px solid #e5e7eb;border-radius:12px;font-size:15px;outline:none;margin-bottom:15px}
input:focus{border-color:#667eea}
button{width:100%;padding:14px;background:#10b981;color:white;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 4px 15px rgba(16,185,129,0.4)}
#msg{margin-top:15px;font-size:13px;min-height:20px;line-height:1.4}
.back{margin-top:15px;display:block;color:#666;font-size:13px;text-decoration:none}
</style>
</head><body>
<div class="card">
<h2>Unlock Notes - ₹99</h2>
<p class="sub">Scan & pay, then enter UTR number</p>
<div class="email-badge" id="emailShow"></div>
<div class="qr-box">
<img src="qr.jpg" onerror="this.style.display='none';document.getElementById('qrText').style.display='block'">
<p id="qrText" style="display:none;color:#999">Upload your QR as qr.jpg<br>in GitHub repo</p>
</div>
<input type="text" id="utr" placeholder="Enter 12-digit UTR / Transaction ID">
<button id="submitBtn">Submit Payment Proof</button>
<div id="msg"></div>
<a href="login.html" class="back">← Change email</a>
</div>
<script>
const supabase = window.supabase.createClient('https://ztocwdfliodtjvmddqvb.supabase.co','sb_publishable_YhnQ6f1iSiaXt92GamwJPA_YWBIal-t');
const email = localStorage.getItem('student_email');
if(!email){location.href='login.html';}
document.getElementById('emailShow').textContent=email;
const btn=document.getElementById('submitBtn');
btn.onclick=async()=>{
 const utr=document.getElementById('utr').value.trim();
 const msg=document.getElementById('msg');
 if(utr.length<6){msg.style.color='red';msg.textContent='Enter valid UTR number';return;}
 btn.disabled=true; btn.textContent='Submitting...'; msg.style.color='#667eea'; msg.textContent='Saving...';
 const {error}=await supabase.from('payments').insert({email:email,utr:utr,status:'pending'});
 if(error){
   if(error.message.includes('duplicate')){msg.style.color='orange';msg.textContent='Already submitted! Wait for approval.';}
   else{msg.style.color='red';msg.textContent='Error: '+error.message;}
   btn.disabled=false; btn.textContent='Submit Payment Proof'; return;
 }
 msg.style.color='green'; msg.innerHTML='✅ Submitted!<br>WhatsApp me after payment<br>Once approved, go to <b>index.html</b>';
 btn.textContent='Submitted ✓';
};
</script>
</body></html>
