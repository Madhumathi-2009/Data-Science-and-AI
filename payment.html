<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unlock Notes - ₹99</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{min-height:100vh;background:#6d5af7;display:flex;justify-content:center;align-items:center;padding:20px}
.card{background:white;width:100%;max-width:380px;padding:28px 24px;border-radius:24px;box-shadow:0 20px 40px rgba(0,0,0,0.2);text-align:center}
h2{font-size:22px;font-weight:700} .sub{color:#777;font-size:13px;margin:6px 0 18px}
.qr-wrap{background:#f7f9ff;border:1.5px dashed #d0d7f0;border-radius:16px;padding:18px 12px;margin-bottom:18px}
.qr-wrap img{width:100%;max-width:260px;border-radius:12px}
.upi{font-size:11px;color:#555;margin-top:10px} .scan{font-size:11px;color:#888;margin-top:8px}
input{width:100%;padding:14px 16px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:15px;outline:none;margin-bottom:12px}
input:focus{border-color:#6d5af7}
button{width:100%;padding:15px;background:#00c389;color:white;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(0,195,137,0.35)}
button:active{transform:scale(0.98)} button:disabled{opacity:0.6}
#msg{margin-top:12px;font-size:13px;min-height:18px;line-height:1.4}
.link{margin-top:18px;display:block;color:#888;font-size:13px;text-decoration:none}
.email{font-size:12px;background:#eef2ff;color:#6d5af7;padding:5px 10px;border-radius:20px;display:inline-block;margin-bottom:12px}
</style>
</head><body>
<div class="card">
<h2>Unlock Notes - ₹99</h2>
<p class="sub">Scan & pay, then enter UTR number</p>
<div class="email" id="emailShow"></div>
<div class="qr-wrap">
<img src="qr.jpg" id="qrImg" alt="QR Code">
<div class="upi">UPI ID: <b>madhu12lakshmi@oksbi</b></div>
<div class="scan">Scan to pay with any UPI app</div>
</div>
<input type="text" id="utr" placeholder="Enter your transaction ID" inputmode="numeric">
<button id="submitBtn">Submit Payment Proof</button>
<div id="msg"></div>
<a href="login.html" class="link">← Change email</a>
</div>
<script>
// 1. Check email exists
const email = localStorage.getItem('student_email');
if(!email){ window.location.href='login.html'; }
document.getElementById('emailShow').textContent = email;

// 2. If qr.jpg fails, show placeholder (your QR)
document.getElementById('qrImg').onerror = function(){
  this.src = 'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=upi://pay?pa=madhu12lakshmi@oksbi%26pn=Madhumathi%26am=99%26cu=INR';
};

// 3. WORKING SUBMIT - NO MORE STUCK!
document.getElementById('submitBtn').onclick = function(){
  const utrInput = document.getElementById('utr');
  const utr = utrInput.value.trim();
  const msg = document.getElementById('msg');
  const btn = document.getElementById('submitBtn');
  
  if(utr.length < 10){
    msg.style.color='red'; msg.textContent='Please enter valid UTR: '+utr;
    return;
  }
  
  // Instant feedback - NO BLOCKING
  btn.textContent = 'Processing...'; btn.disabled = true;
  msg.style.color='#6d5af7'; msg.textContent='Saving your payment proof...';
  
  // Save locally instantly
  localStorage.setItem('payment_utr', utr);
  localStorage.setItem('payment_status', 'pending');
  localStorage.setItem('payment_time', new Date().toISOString());
  
  // Show success after 800ms
  setTimeout(()=>{
    msg.style.color='green';
    msg.innerHTML = `✅ Payment proof saved!<br>UTR: <b>${utr}</b><br><br>Share your payment screenshot on WhatsApp-7695998405 to approve fast<br>Then go to <a href="index.html" style="color:#6d5af7;font-weight:600">index.html</a> to access notes`;
    btn.textContent = 'Submitted ✓ - Wait for Approval';
    btn.style.background = '#10b981';
    
    // Try to save to Supabase in background (optional, won't block)
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    script.onload = async () => {
      try{
        const supa = window.supabase.createClient('https://ztocwdfliodtjvmddqvb.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp0b2N3ZGZsaW9kdGp2bWRkcXZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg2OTAxNDQsImV4cCI6MjA3NDI2NjE0NH0.9Oq2dX8sLh7h7h7h7h7h7h7h7'); // fallback anon key
        await supa.from('payments').insert({email:email, utr:utr, status:'pending'});
      }catch(e){ console.log('Supabase background save failed (ok)', e); }
    };
    document.head.appendChild(script);
  }, 800);
};
</script>
</body></html>
