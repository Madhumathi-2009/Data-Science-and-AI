<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment - Data Science Notes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f5f5f5;display:flex;justify-content:center;padding:20px;margin:0}
.card{background:white;padding:25px;border-radius:12px;max-width:450px;width:100%;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
.qr{width:250px;height:250px;background:#eee;margin:15px auto;display:flex;align-items:center;justify-content:center;border-radius:8px}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;background:green;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
#msg{margin-top:12px;font-size:14px}
</style>
</head><body>
<div class="card">
<h2>Unlock All Notes - ₹99</h2>
<p>Pay on this QR, then enter UTR number</p>
<div class="qr">
<!-- REPLACE THIS WITH YOUR QR IMAGE -->
<p>Your QR Here<br>Upload qr.jpg</p>
<img src="qr.jpg" style="width:100%;display:none" onload="this.style.display='block'" onerror="this.style.display='none'">
</div>
<p>Email: <b id="emailShow"></b></p>
<input type="text" id="utr" placeholder="Enter UTR / Transaction ID (12 digits)">
<button id="submitBtn">Submit Payment Proof</button>
<div id="msg"></div>
</div>
<script>
const supabase = window.supabase.createClient('https://ztocwdfliodtjvmddqvb.supabase.co','sb_publishable_YhnQ6f1iSiaXt92GamwJPA_YWBIal-t');
const email = localStorage.getItem('student_email');
if(!email){location.href='login.html';}
document.getElementById('emailShow').textContent=email;
document.getElementById('submitBtn').onclick=async()=>{
 const utr=document.getElementById('utr').value.trim();
 if(!utr){document.getElementById('msg').textContent='Enter UTR';return;}
 document.getElementById('msg').style.color='blue';
 document.getElementById('msg').textContent='Submitting...';
 const {error}=await supabase.from('payments').insert({email:email, utr:utr, status:'pending'});
 if(error){document.getElementById('msg').style.color='red';document.getElementById('msg').textContent='Error: '+error.message+' - Maybe already submitted?';return;}
 document.getElementById('msg').style.color='green';
 document.getElementById('msg').innerHTML='Submitted! Wait for approval.<br>After I approve, open index.html again.';
};
</script>
</body></html>
