<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Data Science Notes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f0f0f0;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:white;padding:30px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1);width:90%;max-width:380px;text-align:center}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;margin:8px 0;border:none;border-radius:8px;cursor:pointer;font-weight:bold;color:white}
.blue{background:#3b82f6}.green{background:#10b981}.black{background:black}
#msg{margin-top:12px;font-size:14px;min-height:20px}
</style>
</head><body>
<div class="card">
<h2>BSc Data Science Notes</h2>
<p>Enter your email to login</p>
<input type="email" id="email" placeholder="your@gmail.com">
<input type="text" id="otp" placeholder="Enter 6-digit code" style="display:none">
<button class="blue" id="sendBtn">Send OTP Code</button>
<button class="green" id="verifyBtn" style="display:none">Verify & Login</button>
<div id="msg"></div>
</div>
<script>
const supabase = window.supabase.createClient('https://ztocwdfliodtjvmddqvb.supabase.co','sb_publishable_YhnQ6f1iSiaXt92GamwJPA_YWBIal-t');
const emailEl=document.getElementById('email'), otpEl=document.getElementById('otp'), sendBtn=document.getElementById('sendBtn'), verifyBtn=document.getElementById('verifyBtn'), msg=document.getElementById('msg');
function show(t,c){msg.style.color=c||'black';msg.textContent=t;}
sendBtn.onclick=async()=>{
 const email=emailEl.value.trim(); if(!email){show('Enter email','red');return;}
 show('Sending code to '+email+'...','blue');
 const {error}=await supabase.auth.signInWithOtp({email});
 if(error){show('Error: '+error.message,'red');return;}
 show('Code sent! Check your email inbox/spam for 6-digit code','green');
 otpEl.style.display='block'; verifyBtn.style.display='block'; sendBtn.style.display='none'; emailEl.disabled=true;
};
verifyBtn.onclick=async()=>{
 const email=emailEl.value.trim(), token=otpEl.value.trim();
 if(!token){show('Enter code','red');return;}
 show('Verifying...','blue');
 const {data,error}=await supabase.auth.verifyOtp({email,token,type:'email'});
 if(error){show('Wrong code: '+error.message,'red');return;}
 show('Login success! Checking payment...','green');
 const {data:pay}=await supabase.from('payments').select('*').eq('email',email).eq('status','approved').maybeSingle();
 if(pay) location.href='index.html'; else location.href='payment.html';
};
</script>
</body></html>
