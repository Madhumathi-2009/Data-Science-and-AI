<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Data Science Notes</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#f0f0f0;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:white;padding:30px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1);width:90%;max-width:380px;text-align:center}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;margin:8px 0;border:none;border-radius:8px;cursor:pointer;font-weight:bold;color:white;background:black}
#msg{margin-top:12px;font-size:14px;color:red}
</style>
</head><body>
<div class="card">
<h2>BSc Data Science Notes</h2>
<p>Enter your email to continue</p>
<input type="email" id="email" placeholder="your@gmail.com">
<button id="loginBtn">Continue</button>
<div id="msg"></div>
</div>
<script>
const supabase = window.supabase.createClient('https://ztocwdfliodtjvmddqvb.supabase.co','sb_publishable_YhnQ6f1iSiaXt92GamwJPA_YWBIal-t');
document.getElementById('loginBtn').onclick = async () => {
  const email = document.getElementById('email').value.trim();
  if(!email){document.getElementById('msg').textContent='Enter email';return;}
  localStorage.setItem('student_email', email);
  document.getElementById('msg').style.color='blue';
  document.getElementById('msg').textContent='Checking payment...';
  // Check if already approved
  const {data} = await supabase.from('payments').select('*').eq('email',email).eq('status','approved').maybeSingle();
  if(data){
    localStorage.setItem('payment_approved','true');
    window.location.href='index.html';
  } else {
    window.location.href='payment.html';
  }
};
</script>
</body></html>
